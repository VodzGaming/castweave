name: Build CastWeave
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake --preset windows-x64 -DSTREAMDOCK_BUILD_PREVIEW=ON
      - name: Build
        run: cmake --build --preset windows-x64
      - name: Test updater and preview
        shell: pwsh
        run: |
          ./scripts/test-update.ps1
          $qt = Get-ChildItem .deps -Directory -Filter 'obs-deps-qt6-*-x64' | Select-Object -First 1
          $native = Get-ChildItem .deps -Directory -Filter 'obs-deps-20*-x64' | Where-Object Name -NotLike 'obs-deps-qt6-*' | Select-Object -First 1
          if (!$qt -or !$native) { throw 'OBS Qt runtime dependencies were not found.' }
          $env:PATH = "$($qt.FullName)\bin;$($native.FullName)\bin;$env:PATH"
          $env:QT_PLUGIN_PATH = "$($qt.FullName)\plugins"
          $env:QT_QPA_PLATFORM = 'minimal'
          & ./build_x64/RelWithDebInfo/streamdock-preview.exe
          if ($LASTEXITCODE -ne 0) { throw "CastWeave preview checks failed with exit code $LASTEXITCODE." }
      - name: Package
        shell: pwsh
        run: |
          cmake --install build_x64 --config RelWithDebInfo --prefix stage
          $version = (Get-Content buildspec.json -Raw | ConvertFrom-Json).version
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") { throw 'Tag and version differ' }
          Compress-Archive -Path stage/castweave -DestinationPath "CastWeave-$version-windows-x64.zip"
          choco install nsis --yes --no-progress
          ./scripts/build-installer.ps1 -StagePath stage -OutputDirectory .
          Get-FileHash "CastWeave-$version-windows-x64.zip", "CastWeave-$version-windows-x64-Setup.exe" | ForEach-Object { $_.Hash + "  " + (Split-Path $_.Path -Leaf) } | Set-Content SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: CastWeave-windows-x64
          path: |
            CastWeave-*-windows-x64.zip
            CastWeave-*-windows-x64-Setup.exe
            SHA256SUMS.txt
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: CastWeave-windows-x64
          path: release-assets
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" release-assets/* --verify-tag --draft --title "CastWeave $RELEASE_TAG" --notes-file RELEASE_NOTES.md
